[project]
name = "legaldoc-extraction"
version = "0.19.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "langchain-core>=1.6.2",
  "langchain-openai>=1.6.1",
  "langgraph>=1.2.11",
  "numpy>=2.5.3",
  "openai>=3.9.0",
  "openai-agents>=0.22.1",
  "openpyxl>=3.1.5",
  "orjson>=3.12.0",
  "pandas>=3.0.5",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "pyjwt>=2.13.0",
  "pymupdf>=1.28.2",
  "python-dotenv>=1.2.3",
  "python-multipart>=0.0.32",
  "ruff>=0.16.6",
  "tqdm>=4.70.0",
  "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legaldoc_extraction"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "B9",
  "I",
  "UP",
  "SIM",
  "C4",
  "ARG",
  "DTZ",
  "G",
  "S",
  "RUF",
  "PT",
  "PIE",
  "T20",
]
ignore = ["B008", "S101", "S105", "S106", "G004", "T201", "S112", "E731", "S311"]
unfixable = ["DTZ", "S"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*" = ["S101", "ARG", "T20"]
"test_*.py" = ["S101", "ARG", "T20"]
"*.ipynb" = ["T20", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["legaldoc_extraction"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
examples = ["reportlab>=5.0.1"]
