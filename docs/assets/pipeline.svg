<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="662" viewBox="0 0 1080 662" role="img" aria-labelledby="title desc">
  <title id="title">LegalDoc Extraction pipeline</title>
  <desc id="desc">Flowchart of one PDF through two LangGraph workflows. Loader graph: PDF artifact, vision OCR (model; a truncated reply is re-read in smaller chunks), merge in page order (code), repair agent loop fixes OCR seams (edits must cite line hashes and the section map must fit the headings), producing cached Markdown with a section map. Extractor graph: slice sections with 3 lines of context (code; the map must fit the text or the agent reruns), overview and mitigations (model; schema-validated), clause pointers guided by mitigation headers (model; start and end references only), copy the referenced lines verbatim with Hashline (code; both references must match their line hashes), match by lexical and embedding similarity (code; best score of at least 0.5 is paired, else left empty), repair agent loop tidies the JSON rows (must parse with the same shape and be fully reread), producing canonical JSON with one row per clause, rendered as JSON, CSV or XLSX on download.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cbd1d4"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#151719"/></marker>
    <style>
  .sans { font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", ui-sans-serif, system-ui, Arial, sans-serif; }
  .mono { font-family: "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace; }
  .ink { fill: #151719; }
  .muted { fill: #5d646a; }
  .white { fill: #ffffff; }
  .lav { fill: #dce3ff; }
  .invmuted { fill: #d8dde0; }
  .lime { fill: #b9f227; }
  .coral { fill: #c93a28; }
  .teal { fill: #1d7a6e; }
  .flow { fill: none; stroke: #151719; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
</style>
  </defs>
  <rect width="1080" height="662" fill="#f7f8f5"/>
  <rect width="1080" height="662" fill="url(#grid)" opacity="0.24"/>
