<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">Repair agent passes</title>
  <desc id="desc">Four illustrative passes of the repair agent over one working copy: five edits, then two, then one, then none left, at which point the copy is kept. Safeguards: edits cite line hashes so stale edits are rejected; MAX_FIXER_TURNS caps a session and keeps the last fully reread copy; the source PDF is never edited.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cbd1d4"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#151719"/></marker>
    <style>
  .sans { font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", ui-sans-serif, system-ui, Arial, sans-serif; }
  .mono { font-family: "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace; }
  .ink { fill: #151719; }
  .muted { fill: #5d646a; }
  .white { fill: #ffffff; }
  .lav { fill: #dce3ff; }
  .invmuted { fill: #d8dde0; }
  .lime { fill: #b9f227; }
  .coral { fill: #c93a28; }
  .teal { fill: #1d7a6e; }
  .flow { fill: none; stroke: #151719; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
</style>
  </defs>
  <rect width="1080" height="470" fill="#f7f8f5"/>
  <rect width="1080" height="470" fill="url(#grid)" opacity="0.24"/>
