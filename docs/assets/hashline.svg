<rect x="548" y="214" width="494" height="34" fill="#eef1f2" stroke="#151719" stroke-width="2"/>
<text x="562" y="235" class="sans ink" font-size="10.5" font-weight="800" letter-spacing="1.25">COPY · CLAUSE EXTRACTOR</text>
<text x="1028" y="235" class="mono muted" font-size="11.5" font-weight="700" text-anchor="end">read_hashline_range</text>
<text x="566" y="270" class="sans muted" font-size="10.5" font-weight="800" letter-spacing="1.25">PREPARED MARKDOWN · BLANK LINES HIDDEN</text>
<rect x="566" y="280" width="458" height="125" fill="#ffffff" stroke="#151719" stroke-width="1.5"/><rect x="566" y="280" width="104" height="125" fill="#eef1f2" stroke="#151719" stroke-width="1.5"/><rect x="671" y="281" width="352" height="23" fill="#dce3ff"/><rect x="671" y="281" width="4" height="23" fill="#3655d4"/><text x="660" y="297" class="mono muted" font-size="12" font-weight="700" text-anchor="end">17#3ade50</text><text x="686" y="297" class="sans ink" font-size="13" font-weight="700">4. Equipment return</text><rect x="671" y="306" width="352" height="23" fill="#dce3ff"/><rect x="671" y="306" width="4" height="23" fill="#3655d4"/><text x="660" y="322" class="mono muted" font-size="12" font-weight="700" text-anchor="end">19#c2539c</text><text x="686" y="322" class="sans ink" font-size="13" font-weight="700">4.1 The borrower must return all…</text><rect x="671" y="331" width="352" height="23" fill="#dce3ff"/><rect x="671" y="331" width="4" height="23" fill="#3655d4"/><text x="686" y="347" class="sans muted" font-size="12.5" font-weight="700">⋮  lines 21–29</text><rect x="671" y="356" width="352" height="23" fill="#dce3ff"/><rect x="671" y="356" width="4" height="23" fill="#3655d4"/><text x="660" y="372" class="mono muted" font-size="12" font-weight="700" text-anchor="end">31#31dd66</text><text x="686" y="372" class="sans ink" font-size="13" font-weight="700">4.4 The steward must close the checkout…</text><text x="660" y="397" class="mono muted" font-size="12" font-weight="700" text-anchor="end">33#f3ffbb</text><text x="686" y="397" class="sans ink" font-size="13" font-weight="700">7. Shared access</text>
