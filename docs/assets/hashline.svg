<text x="64" y="158" class="sans lav" font-size="12.5" font-weight="700">Each line: its number + the first 6 hex of its SHA-256</text>
<text x="470" y="134" class="mono" font-size="24" font-weight="800" fill="#ffffff">17</text>
<line x1="470" y1="144" x2="498.8" y2="144" stroke="#ffffff" stroke-width="2"/>
<text x="470" y="164" class="sans lav" font-size="10.5" font-weight="800" letter-spacing="1.25">LINE</text>
