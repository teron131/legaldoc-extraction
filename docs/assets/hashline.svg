<text x="545.2" y="134" class="mono" font-size="24" font-weight="800" fill="#b9f227">3ade50</text>
<line x1="545.2" y1="144" x2="631.6" y2="144" stroke="#b9f227" stroke-width="2"/>
<text x="545.2" y="164" class="sans lav" font-size="10.5" font-weight="800" letter-spacing="1.25">HASH</text>
<text x="647.6" y="134" class="mono" font-size="24" font-weight="800" fill="#dce3ff">:</text>
<text x="678" y="134" class="mono" font-size="24" font-weight="800" fill="#ffffff">4. Equipment return</text>
