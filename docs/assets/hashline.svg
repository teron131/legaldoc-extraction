<rect x="56" y="419" width="458" height="73" fill="#151719"/><text x="70" y="445" class="mono" font-size="12" font-weight="700" xml:space="preserve"><tspan class="invmuted">"operation": </tspan><tspan class="white">"replace_range",</tspan></text><text x="70" y="464" class="mono" font-size="12" font-weight="700" xml:space="preserve"><tspan class="invmuted">"start_ref": </tspan><tspan class="lime">"19#b538cc"</tspan><tspan class="invmuted">, "end_ref": </tspan><tspan class="lime">"20#06cdd9"</tspan><tspan class="invmuted">,</tspan></text><text x="70" y="483" class="mono" font-size="12" font-weight="700" xml:space="preserve"><tspan class="invmuted">"lines": </tspan><tspan class="white">["4.1 The borrower must return … return."]</tspan></text>
