<rect x="56" y="522" width="458" height="75" fill="#ffffff" stroke="#151719" stroke-width="1.5"/><rect x="56" y="522" width="104" height="75" fill="#eef1f2" stroke="#151719" stroke-width="1.5"/><text x="150" y="539" class="mono muted" font-size="12" font-weight="700" text-anchor="end">17#3ade50</text><text x="176" y="539" class="sans ink" font-size="13" font-weight="700">4. Equipment return</text><rect x="161" y="548" width="352" height="23" fill="#eaf8bf"/><rect x="161" y="548" width="4" height="23" fill="#b9f227"/><text x="150" y="564" class="mono muted" font-size="12" font-weight="700" text-anchor="end">19#c2539c</text><text x="176" y="564" class="sans ink" font-size="13" font-weight="700">4.1 The borrower must return all…</text><text x="150" y="589" class="mono muted" font-size="12" font-weight="700" text-anchor="end">21#0b1f90</text><text x="176" y="589" class="sans ink" font-size="13" font-weight="700">4.2 Before accepting an item, the…</text>
<text x="56" y="623" class="sans muted" font-size="12" font-weight="700">Also insert_before, insert_after, append; up to 20 per batch.</text>
</g>
