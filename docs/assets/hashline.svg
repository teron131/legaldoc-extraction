<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="828" viewBox="0 0 1080 828" role="img" aria-labelledby="title desc">
  <title id="title">Hashline</title>
  <desc id="desc">Hashline is a line-addressed read and edit tool. A reference such as 17#3ade50 is a line number plus the first six hex characters of the line&#x27;s SHA-256. Edit, used by the repair agent loops through edit_document: raw OCR split clause 4.1 across lines 19 and 20; a replace_range from 19#b538cc to 20#06cdd9 joins them into the prepared line 19#c2539c, and line 22 moves up to 21 keeping its hash; insert_before, insert_after and append also exist, with up to 20 edits per batch. Copy, used by the clause extractor: read_hashline_range with 17#3ade50 and 31#31dd66 returns lines 17 to 31 word for word; the model supplied only the two references. Every reference is checked against the current text: if its line still has that hash it is used; otherwise exactly one match within three lines is used; otherwise it is rejected and the current lines are shown.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cbd1d4"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#151719"/></marker>
    <style>
  .sans { font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", ui-sans-serif, system-ui, Arial, sans-serif; }
  .mono { font-family: "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace; }
  .ink { fill: #151719; }
  .muted { fill: #5d646a; }
  .white { fill: #ffffff; }
  .lav { fill: #dce3ff; }
  .invmuted { fill: #d8dde0; }
  .lime { fill: #b9f227; }
  .coral { fill: #c93a28; }
  .teal { fill: #1d7a6e; }
  .flow { fill: none; stroke: #151719; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
</style>
  </defs>
  <rect width="1080" height="828" fill="#f7f8f5"/>
  <rect width="1080" height="828" fill="url(#grid)" opacity="0.24"/>
<g id="header"><text x="38" y="54" class="sans ink" font-size="12" font-weight="700" letter-spacing="1.5">LEGALDOC EXTRACTION / HASHLINE</text></g>
