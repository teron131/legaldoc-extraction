<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="784" viewBox="0 0 1080 784" role="img" aria-labelledby="title desc">
  <title id="title">Header matching</title>
  <desc id="desc">Header matching. Lexical similarity (code, no model call) averages numbering affinity with the best of character, token and substring overlap. Embedding similarity (model) embeds each distinct header once and takes the cosine, clipped to 0 to 1. The combined score is half of each; the best candidate per clause is paired if it scores at least 0.5, otherwise the mitigation stays empty, with no source-document filter. Worked example for clause 4. Equipment return, Document A, with lexical scores computed by the matcher and illustrative embedding scores: 4. Return of borrowed items 0.65 and 0.74, combined 0.70, paired; 4. Restoring the activity area (Document B) 0.62 and 0.41, 0.51; 7. Access to shared equipment 0.21 and 0.52, 0.37; 12. Keeping loan records 0.19 and 0.46, 0.33; 12. Aggregate participation reporting 0.18 and 0.15, 0.17; 7. Changes to activity times 0.10 and 0.18, 0.14.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cbd1d4"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#151719"/></marker>
    <style>
  .sans { font-family: "Avenir Next", "Helvetica Neue", "Segoe UI", ui-sans-serif, system-ui, Arial, sans-serif; }
  .mono { font-family: "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace; }
  .ink { fill: #151719; }
  .muted { fill: #5d646a; }
  .white { fill: #ffffff; }
  .lav { fill: #dce3ff; }
  .invmuted { fill: #d8dde0; }
  .lime { fill: #b9f227; }
  .coral { fill: #c93a28; }
  .teal { fill: #1d7a6e; }
  .flow { fill: none; stroke: #151719; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
</style>
  </defs>
